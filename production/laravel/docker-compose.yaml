services:
  cloudflared:
    container_name: ${PROJECT_NAME}_tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_PROD}
    networks:
      - app-network

  nginx:
    container_name: ${PROJECT_NAME}_webserver
    image: ${IMAGE_REGISTRY_PREFIX}-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - app-storage:/var/www/storage:ro
      - app-build:/var/www/public/build:ro
    networks:
      - app-network
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    container_name: ${PROJECT_NAME}_app
    image: ${IMAGE_REGISTRY_PREFIX}-php-fpm:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - TZ=${TZ:-Asia/Jakarta}
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/storage
      - app-build:/var/www/public/build
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy

  php-cli:
    container_name: ${PROJECT_NAME}_workspace
    image: ${IMAGE_REGISTRY_PREFIX}-php-cli:${IMAGE_TAG:-latest}
    profiles:
      - workspace
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    container_name: ${PROJECT_NAME}_queue
    image: ${IMAGE_REGISTRY_PREFIX}-php-cli:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    command: ["php", "artisan", "queue:work", "--tries=3"]
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network

  scheduler:
    container_name: ${PROJECT_NAME}_scheduler
    image: ${IMAGE_REGISTRY_PREFIX}-php-cli:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    container_name: ${PROJECT_NAME}_db
    image: mysql:lts
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-Asia/Jakarta}
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  app-network:
    name: ${PROJECT_NAME}-network

volumes:
  mysql-data:
    name: ${PROJECT_NAME}-mysql-data
  app-storage:
    name: ${PROJECT_NAME}-storage
  app-build:
    name: ${PROJECT_NAME}-public-assets